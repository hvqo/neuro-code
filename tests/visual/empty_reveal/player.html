<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neuro Code · Production Vortex Reveal</title>
<style>
body{background:#181818;color:#ddd;margin:24px;font:14px system-ui}h1{font-size:20px;font-weight:500}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{background:#333;color:#eee;border:1px solid #666;padding:6px 10px}
#screen svg{width:100%;max-width:1100px;display:block;cursor:pointer}#status{font:13px monospace;margin:12px 0}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.keys img{width:100%}figure{margin:0}figcaption{margin:8px 0;color:#aaa}
</style><h1>Empty State Reveal · Continuous Vortex · Production</h1>
<p>基于你提供的 neuro_vortex.py：分层反向扭转、透视倾斜、短拖尾与外扩冲击。6 秒 / 24fps / 145 个采样（含首尾）。默认静止，主动触发；播放中重复点击忽略。</p>
<p>Shell 来自真实 Textual 截图，Logo 使用 production 帧数据和主题解析样式，按实际 cell geometry 局部播放；关键帧为完整 Textual 截图。浏览器不能证明 Konsole 的字体、dim 强度或实际 repaint cadence。</p>
<div class="controls"><label>Theme <select id="theme"><option>system</option><option selected>graphite</option><option>porcelain</option></select></label><label>Viewport <select id="viewport"><option>120x40</option><option>100x32</option><option>80x24</option></select></label><label>Speed <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="2">2×</option></select></label><button id="play">Play once</button><button id="stop">Resting</button><label><input id="repeat" type="checkbox">Repeat（仅预览）</label></div>
<div id="screen" aria-label="production terminal preview"></div><div id="status"></div><div class="keys" id="keys"></div>
<script id="frames" type="application/json">__FRAME_DATA__</script><script>
const data=JSON.parse(document.querySelector('#frames').textContent),screen=document.querySelector('#screen'),status=document.querySelector('#status');
const ns='http://www.w3.org/2000/svg',last=data.frames.length-1,ends=[];let sum=0;for(const d of data.durations){sum+=d;ends.push(sum)}
let timer=null,running=false,started=0,frame=-1,cells=[],capture;
const key=()=>document.querySelector('#theme').value+'-'+document.querySelector('#viewport').value;
function shell(){capture=data.shells[key()];screen.innerHTML=capture.shell;const group=screen.querySelector('#terminal-grid'),rows=data.frames[0][capture.size][0],o=capture.origin;cells=[];rows.forEach((row,y)=>{const line=[];[...row].forEach((char,x)=>{const cell=document.createElementNS(ns,'text');cell.setAttribute('x',o.x+x*o.dx);cell.setAttribute('y',o.y+y*o.dy);cell.setAttribute('font-variant-ligatures','none');group.appendChild(cell);line.push(cell)});cells.push(line)});frame=-1}
function show(i){if(frame!==i){const [rows,levels]=data.frames[i][capture.size];rows.forEach((row,y)=>[...row].forEach((ch,x)=>{const c=cells[y][x];c.textContent=ch;c.style.fill=capture.palette[parseInt(levels[y][x],16)]}));frame=i}status.textContent=`Sample ${i+1}/${data.frames.length} · ${running?'Playing':'Resting'} · 24fps · ${sum}ms`}
function stop(){clearTimeout(timer);timer=null;running=false;show(0)}
function tick(){const speed=Number(document.querySelector('#speed').value),elapsed=(performance.now()-started)*speed;if(elapsed>=sum){running=false;timer=null;show(last);if(document.querySelector('#repeat').checked)timer=setTimeout(play,1400);return}let index=0;while(elapsed>=ends[index])index++;show(index);timer=setTimeout(tick,Math.max(1,(ends[index]-elapsed)/speed))}
function play(){if(running)return;clearTimeout(timer);running=true;started=performance.now();tick()}
function keys(){document.querySelector('#keys').innerHTML=Object.entries(data.keyframes).map(([name,i])=>`<figure><figcaption>${name} · ${Math.round((i/last)*sum)}ms</figcaption><img src="${data.captures[key()][i]}" alt="${name}"></figure>`).join('')}
document.querySelector('#play').onclick=play;document.querySelector('#stop').onclick=stop;
screen.onclick=play;for(const id of ['theme','viewport','speed'])document.querySelector('#'+id).onchange=()=>{stop();shell();show(0);keys()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',stop);shell();show(0);keys();
</script></html>
