</text><text class="terminal-30045873-r1" x="48.8" y="239.6" textLength="1110.2" clip-path="url(#terminal-30045873-line-9)">source&#160;evidence,&#160;including&#160;the&#160;cancellation&#160;and&#160;recovery&#160;paths,&#160;rather&#160;than&#160;inferred&#160;from&#160;a</text><text class="terminal-30045873-r1" x="1220" y="239.6" textLength="12.2" clip-path="url(#terminal-30045873-line-9)">
</text><text class="terminal-30045873-r1" x="48.8" y="264" textLength="1110.2" clip-path="url(#terminal-30045873-line-10)">convenient&#160;module&#160;name.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-30045873-r1" x="1220" y="264" textLength="12.2" clip-path="url(#terminal-30045873-line-10)">
