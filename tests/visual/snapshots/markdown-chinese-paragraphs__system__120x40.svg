    <text class="terminal-125255351-r1" x="36.6" y="20" textLength="61" clip-path="url(#terminal-125255351-line-0)">NEURO</text><text class="terminal-125255351-r2" x="97.6" y="20" textLength="85.4" clip-path="url(#terminal-125255351-line-0)">&#160;/&#160;CODE</text><text class="terminal-125255351-r2" x="1366.4" y="20" textLength="61" clip-path="url(#terminal-125255351-line-0)">13:37</text><text class="terminal-125255351-r1" x="1464" y="20" textLength="12.2" clip-path="url(#terminal-125255351-line-0)">
</text><text class="terminal-125255351-r1" x="1464" y="44.4" textLength="12.2" clip-path="url(#terminal-125255351-line-1)">
</text><text class="terminal-125255351-r1" x="36.6" y="68.8" textLength="12.2" clip-path="url(#terminal-125255351-line-2)">│</text><text class="terminal-125255351-r1" x="1464" y="68.8" textLength="12.2" clip-path="url(#terminal-125255351-line-2)">
</text><text class="terminal-125255351-r1" x="36.6" y="93.2" textLength="12.2" clip-path="url(#terminal-125255351-line-3)">│</text><text class="terminal-125255351-r1" x="61" y="93.2" textLength="500.2" clip-path="url(#terminal-125255351-line-3)">请审查下面的内容&#160;/&#160;Review&#160;the&#160;following&#160;evidence.</text><text class="terminal-125255351-r1" x="1464" y="93.2" textLength="12.2" clip-path="url(#terminal-125255351-line-3)">
</text><text class="terminal-125255351-r1" x="36.6" y="117.6" textLength="12.2" clip-path="url(#terminal-125255351-line-4)">│</text><text class="terminal-125255351-r1" x="1464" y="117.6" textLength="12.2" clip-path="url(#terminal-125255351-line-4)">
</text><text class="terminal-125255351-r1" x="1464" y="142" textLength="12.2" clip-path="url(#terminal-125255351-line-5)">
</text><text class="terminal-125255351-r1" x="1464" y="166.4" textLength="12.2" clip-path="url(#terminal-125255351-line-6)">
</text><text class="terminal-125255351-r1" x="48.8" y="190.8" textLength="683.2" clip-path="url(#terminal-125255351-line-7)">这次仓库审查从用户可观察的行为开始。我们先检查配置如何进入应用，再沿着请求链路确认权限、工作区与持久化之间的边界</text><text class="terminal-125255351-r1" x="1464" y="190.8" textLength="12.2" clip-path="url(#terminal-125255351-line-7)">
</text><text class="terminal-125255351-r1" x="48.8" y="215.2" textLength="1024.8" clip-path="url(#terminal-125255351-line-8)">。结论需要来自当前源码与测试，而不是仅凭文件名猜测职责。&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-125255351-r1" x="1464" y="215.2" textLength="12.2" clip-path="url(#terminal-125255351-line-8)">
</text><text class="terminal-125255351-r1" x="1464" y="239.6" textLength="12.2" clip-path="url(#terminal-125255351-line-9)">
</text><text class="terminal-125255351-r1" x="1464" y="264" textLength="12.2" clip-path="url(#terminal-125255351-line-10)">
</text><text class="terminal-125255351-r1" x="48.8" y="288.4" textLength="683.2" clip-path="url(#terminal-125255351-line-11)">第一组证据说明，界面层负责把输入转换成应用请求，核心服务负责维护状态一致性。即使终端宽度改变，段内自动换行也应保</text><text class="terminal-125255351-r1" x="1464" y="288.4" textLength="12.2" clip-path="url(#terminal-125255351-line-11)">
</text><text class="terminal-125255351-r1" x="48.8" y="312.8" textLength="1085.8" clip-path="url(#terminal-125255351-line-12)">持紧凑；它并不表示用户开始了一个新的语义段落。&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-125255351-r1" x="1464" y="312.8" textLength="12.2" clip-path="url(#terminal-125255351-line-12)">
</text><text class="terminal-125255351-r1" x="1464" y="337.2" textLength="12.2" clip-path="url(#terminal-125255351-line-13)">
</text><text class="terminal-125255351-r1" x="1464" y="361.6" textLength="12.2" clip-path="url(#terminal-125255351-line-14)">
</text><text class="terminal-125255351-r1" x="48.8" y="386" textLength="683.2" clip-path="url(#terminal-125255351-line-15)">第二组证据关注恢复路径。进程重新启动后，已有会话应恢复同一项目归属，同时重新检查当前工作区的真实状态。旧记忆只是</text><text class="terminal-125255351-r1" x="1464" y="386" textLength="12.2" clip-path="url(#terminal-125255351-line-15)">
</text><text class="terminal-125255351-r1" x="48.8" y="410.4" textLength="1122.4" clip-path="url(#terminal-125255351-line-16)">上下文证据，不能替代文件检查与权限判断。&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-125255351-r1" x="1464" y="410.4" textLength="12.2" clip-path="url(#terminal-125255351-line-16)">
</text><text class="terminal-125255351-r1" x="1464" y="434.8" textLength="12.2" clip-path="url(#terminal-125255351-line-17)">
</text><text class="terminal-125255351-r1" x="1464" y="459.2" textLength="12.2" clip-path="url(#terminal-125255351-line-18)">
</text><text class="terminal-125255351-r1" x="48.8" y="483.6" textLength="683.2" clip-path="url(#terminal-125255351-line-19)">第三组证据来自失败场景。供应商超时、用户取消和无法执行的验证应留下明确结果。审查报告应区分已确认事实、实现推断和</text><text class="terminal-125255351-r1" x="1464" y="483.6" textLength="12.2" clip-path="url(#terminal-125255351-line-19)">
</text><text class="terminal-125255351-r1" x="48.8" y="508" textLength="1098" clip-path="url(#terminal-125255351-line-20)">仍未解决的问题，避免把部分成功写成完整验收。&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-125255351-r1" x="1464" y="508" textLength="12.2" clip-path="url(#terminal-125255351-line-20)">
</text><text class="terminal-125255351-r1" x="1464" y="532.4" textLength="12.2" clip-path="url(#terminal-125255351-line-21)">
</text><text class="terminal-125255351-r1" x="1464" y="556.8" textLength="12.2" clip-path="url(#terminal-125255351-line-22)">
</text><text class="terminal-125255351-r1" x="48.8" y="581.2" textLength="683.2" clip-path="url(#terminal-125255351-line-23)">最后，我们将独立问题整理成一组可验证的后续行动。正文中的强调只用于重要结论，路径和命令只是定位证据。段落间距应该</text><text class="terminal-125255351-r1" x="1464" y="581.2" textLength="12.2" clip-path="url(#terminal-125255351-line-23)">
</text><text class="terminal-125255351-r1" x="48.8" y="605.6" textLength="1061.4" clip-path="url(#terminal-125255351-line-24)">帮助读者停顿，而不是把每个自动换行都拆成一块空白。&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-125255351-r1" x="1464" y="605.6" textLength="12.2" clip-path="url(#terminal-125255351-line-24)">
</text><text class="terminal-125255351-r1" x="1464" y="630" textLength="12.2" clip-path="url(#terminal-125255351-line-25)">
</text><text class="terminal-125255351-r1" x="1464" y="654.4" textLength="12.2" clip-path="url(#terminal-125255351-line-26)">
</text><text class="terminal-125255351-r1" x="1464" y="678.8" textLength="12.2" clip-path="url(#terminal-125255351-line-27)">
</text><text class="terminal-125255351-r1" x="1464" y="703.2" textLength="12.2" clip-path="url(#terminal-125255351-line-28)">
</text><text class="terminal-125255351-r1" x="1464" y="727.6" textLength="12.2" clip-path="url(#terminal-125255351-line-29)">
</text><text class="terminal-125255351-r1" x="1464" y="752" textLength="12.2" clip-path="url(#terminal-125255351-line-30)">
</text><text class="terminal-125255351-r1" x="1464" y="776.4" textLength="12.2" clip-path="url(#terminal-125255351-line-31)">
</text><text class="terminal-125255351-r1" x="1464" y="800.8" textLength="12.2" clip-path="url(#terminal-125255351-line-32)">
</text><text class="terminal-125255351-r1" x="1464" y="825.2" textLength="12.2" clip-path="url(#terminal-125255351-line-33)">
</text><text class="terminal-125255351-r1" x="1464" y="849.6" textLength="12.2" clip-path="url(#terminal-125255351-line-34)">
</text><text class="terminal-125255351-r1" x="1464" y="874" textLength="12.2" clip-path="url(#terminal-125255351-line-35)">
</text><text class="terminal-125255351-r1" x="1464" y="898.4" textLength="12.2" clip-path="url(#terminal-125255351-line-36)">
</text><text class="terminal-125255351-r2" x="61" y="922.8" textLength="341.6" clip-path="url(#terminal-125255351-line-37)">What&#160;shall&#160;we&#160;work&#160;on&#160;next?&#160;</text><text class="terminal-125255351-r3" x="1305.4" y="922.8" textLength="97.6" clip-path="url(#terminal-125255351-line-37)">&#160;Send&#160;↑&#160;</text><text class="terminal-125255351-r1" x="1464" y="922.8" textLength="12.2" clip-path="url(#terminal-125255351-line-37)">
</text><text class="terminal-125255351-r1" x="1464" y="947.2" textLength="12.2" clip-path="url(#terminal-125255351-line-38)">
</text><text class="terminal-125255351-r2" x="48.8" y="971.6" textLength="1366.4" clip-path="url(#terminal-125255351-line-39)">fixture-model&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;·&#160;high&#160;·&#160;normal&#160;&#160;ctx&#160;≈0&#160;tok&#160;&#160;&#160;&#160;&#160;&#160;/workspace/neuro-code</text>
