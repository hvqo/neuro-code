</text><text class="terminal-233040325-r1" x="36.6" y="68.8" textLength="12.2" clip-path="url(#terminal-233040325-line-2)">│</text><text class="terminal-233040325-r1" x="1464" y="68.8" textLength="12.2" clip-path="url(#terminal-233040325-line-2)">
</text><text class="terminal-233040325-r1" x="36.6" y="93.2" textLength="12.2" clip-path="url(#terminal-233040325-line-3)">│</text><text class="terminal-233040325-r1" x="61" y="93.2" textLength="500.2" clip-path="url(#terminal-233040325-line-3)">请审查下面的内容&#160;/&#160;Review&#160;the&#160;following&#160;evidence.</text><text class="terminal-233040325-r1" x="1464" y="93.2" textLength="12.2" clip-path="url(#terminal-233040325-line-3)">
</text><text class="terminal-233040325-r1" x="36.6" y="117.6" textLength="12.2" clip-path="url(#terminal-233040325-line-4)">│</text><text class="terminal-233040325-r1" x="1464" y="117.6" textLength="12.2" clip-path="url(#terminal-233040325-line-4)">
</text><text class="terminal-233040325-r1" x="1464" y="142" textLength="12.2" clip-path="url(#terminal-233040325-line-5)">
</text><text class="terminal-233040325-r1" x="1464" y="166.4" textLength="12.2" clip-path="url(#terminal-233040325-line-6)">
</text><text class="terminal-233040325-r1" x="48.8" y="190.8" textLength="1366.4" clip-path="url(#terminal-233040325-line-7)">The&#160;review&#160;begins&#160;with&#160;observable&#160;behavior.&#160;Configuration&#160;crosses&#160;the&#160;interface&#160;boundary&#160;before&#160;a&#160;request&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-233040325-r1" x="1464" y="190.8" textLength="12.2" clip-path="url(#terminal-233040325-line-7)">
</text><text class="terminal-233040325-r1" x="48.8" y="215.2" textLength="1366.4" clip-path="url(#terminal-233040325-line-8)">reaches&#160;the&#160;application&#160;service.&#160;Each&#160;claim&#160;should&#160;be&#160;connected&#160;to&#160;current&#160;source&#160;evidence,&#160;including&#160;the&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-233040325-r1" x="1464" y="215.2" textLength="12.2" clip-path="url(#terminal-233040325-line-8)">
</text><text class="terminal-233040325-r1" x="48.8" y="239.6" textLength="1366.4" clip-path="url(#terminal-233040325-line-9)">cancellation&#160;and&#160;recovery&#160;paths,&#160;rather&#160;than&#160;inferred&#160;from&#160;a&#160;convenient&#160;module&#160;name.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-233040325-r1" x="1464" y="239.6" textLength="12.2" clip-path="url(#terminal-233040325-line-9)">
</text><text class="terminal-233040325-r1" x="1464" y="264" textLength="12.2" clip-path="url(#terminal-233040325-line-10)">
</text><text class="terminal-233040325-r1" x="1464" y="288.4" textLength="12.2" clip-path="url(#terminal-233040325-line-11)">
</text><text class="terminal-233040325-r1" x="48.8" y="312.8" textLength="1366.4" clip-path="url(#terminal-233040325-line-12)">Independent&#160;evidence&#160;can&#160;be&#160;gathered&#160;together.&#160;Dependent&#160;operations&#160;still&#160;require&#160;ordering,&#160;and&#160;permission&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-233040325-r1" x="1464" y="312.8" textLength="12.2" clip-path="url(#terminal-233040325-line-12)">
</text><text class="terminal-233040325-r1" x="48.8" y="337.2" textLength="1366.4" clip-path="url(#terminal-233040325-line-13)">remains&#160;authoritative.&#160;A&#160;narrow&#160;terminal&#160;should&#160;wrap&#160;this&#160;paragraph&#160;naturally&#160;without&#160;inserting&#160;artificial&#160;space</text><text class="terminal-233040325-r1" x="1464" y="337.2" textLength="12.2" clip-path="url(#terminal-233040325-line-13)">
</text><text class="terminal-233040325-r1" x="48.8" y="361.6" textLength="1366.4" clip-path="url(#terminal-233040325-line-14)">between&#160;the&#160;wrapped&#160;lines.&#160;The&#160;next&#160;paragraph&#160;is&#160;a&#160;separate&#160;Markdown&#160;block.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-233040325-r1" x="1464" y="361.6" textLength="12.2" clip-path="url(#terminal-233040325-line-14)">
</text><text class="terminal-233040325-r1" x="1464" y="386" textLength="12.2" clip-path="url(#terminal-233040325-line-15)">
</text><text class="terminal-233040325-r1" x="1464" y="410.4" textLength="12.2" clip-path="url(#terminal-233040325-line-16)">
</text><text class="terminal-233040325-r1" x="48.8" y="434.8" textLength="1366.4" clip-path="url(#terminal-233040325-line-17)">The&#160;persistence&#160;layer&#160;keeps&#160;durable&#160;conversation&#160;intact&#160;while&#160;presentation&#160;remains&#160;a&#160;projection.&#160;A&#160;rendering&#160;&#160;&#160;&#160;</text><text class="terminal-233040325-r1" x="1464" y="434.8" textLength="12.2" clip-path="url(#terminal-233040325-line-17)">
</text><text class="terminal-233040325-r1" x="48.8" y="459.2" textLength="1366.4" clip-path="url(#terminal-233040325-line-18)">change&#160;must&#160;not&#160;alter&#160;the&#160;original&#160;response,&#160;provider&#160;requests,&#160;or&#160;the&#160;user&#x27;s&#160;selected&#160;reasoning&#160;effort.&#160;This&#160;&#160;&#160;</text><text class="terminal-233040325-r1" x="1464" y="459.2" textLength="12.2" clip-path="url(#terminal-233040325-line-18)">
</text><text class="terminal-233040325-r1" x="48.8" y="483.6" textLength="1366.4" clip-path="url(#terminal-233040325-line-19)">distinction&#160;is&#160;especially&#160;useful&#160;when&#160;comparing&#160;screenshots&#160;from&#160;several&#160;themes.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-233040325-r1" x="1464" y="483.6" textLength="12.2" clip-path="url(#terminal-233040325-line-19)">
</text><text class="terminal-233040325-r1" x="1464" y="508" textLength="12.2" clip-path="url(#terminal-233040325-line-20)">
</text><text class="terminal-233040325-r1" x="1464" y="532.4" textLength="12.2" clip-path="url(#terminal-233040325-line-21)">
</text><text class="terminal-233040325-r1" x="48.8" y="556.8" textLength="1366.4" clip-path="url(#terminal-233040325-line-22)">The&#160;final&#160;recommendation&#160;records&#160;the&#160;verified&#160;outcome&#160;and&#160;the&#160;remaining&#160;gap.&#160;A&#160;failed&#160;verification&#160;is&#160;reported&#160;&#160;</text><text class="terminal-233040325-r1" x="1464" y="556.8" textLength="12.2" clip-path="url(#terminal-233040325-line-22)">
</text><text class="terminal-233040325-r1" x="48.8" y="581.2" textLength="1366.4" clip-path="url(#terminal-233040325-line-23)">explicitly&#160;instead&#160;of&#160;hidden&#160;behind&#160;a&#160;success&#160;label.&#160;Readability&#160;should&#160;improve&#160;scanning&#160;without&#160;making&#160;a&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-233040325-r1" x="1464" y="581.2" textLength="12.2" clip-path="url(#terminal-233040325-line-23)">
</text><text class="terminal-233040325-r1" x="48.8" y="605.6" textLength="1366.4" clip-path="url(#terminal-233040325-line-24)">compact&#160;terminal&#160;spend&#160;most&#160;of&#160;its&#160;space&#160;on&#160;empty&#160;rows.&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text><text class="terminal-233040325-r1" x="1464" y="605.6" textLength="12.2" clip-path="url(#terminal-233040325-line-24)">
